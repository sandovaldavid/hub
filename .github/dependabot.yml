version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Lima
    open-pull-requests-limit: 2
    rebase-strategy: auto
    assignees:
      - sandovaldavid
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: '@playwright/test'
        update-types:
          - version-update:semver-minor
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      routine-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      major-dependencies:
        patterns:
          - '*'
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: '09:15'
      timezone: America/Lima
    open-pull-requests-limit: 1
    rebase-strategy: auto
    assignees:
      - sandovaldavid
    commit-message:
      prefix: chore(actions)
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: devcontainers
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: '09:30'
      timezone: America/Lima
    open-pull-requests-limit: 1
    rebase-strategy: auto
    assignees:
      - sandovaldavid
    commit-message:
      prefix: chore(devcontainer)
    groups:
      devcontainer-features:
        patterns:
          - '*'
