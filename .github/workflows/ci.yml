name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  BUILD_ARTIFACT_NAME: astro-dist
  PLAYWRIGHT_REPORT_ARTIFACT_NAME: playwright-report

permissions:
  contents: read

jobs:
  # Required-check contract for #32. Do not rename without updating the rulesets documentation.
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx astro check

      - name: Architecture check
        run: bun run check:architecture

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Upload production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: dist/
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report_available: ${{ steps.detect_report.outputs.available }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: dist

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e

      - name: Detect Playwright report
        id: detect_report
        if: always()
        shell: bash
        run: |
          if [[ -f playwright-report/index.html ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "[info] Playwright HTML report generated"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "[warning] Playwright HTML report was not generated"
          fi

      - name: Upload Playwright report
        if: ${{ always() && steps.detect_report.outputs.available == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PLAYWRIGHT_REPORT_ARTIFACT_NAME }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: error

  publish-playwright-report:
    name: Playwright report availability
    needs: e2e
    if: ${{ always() && needs.e2e.outputs.report_available == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPORT_DIRECTORY: ${{ github.event.pull_request.number || github.ref_name }}
    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PLAYWRIGHT_REPORT_ARTIFACT_NAME }}
          path: playwright-report

      - name: Deploy Playwright report to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: playwright-report/${{ env.REPORT_DIRECTORY }}
          keep_files: true

      - name: Document report availability
        shell: bash
        run: |
          REPORT_URL="https://sandovaldavid.github.io/linktree/playwright-report/${REPORT_DIRECTORY}/"
          {
            echo "## Playwright report availability"
            echo
            echo "The HTML report was published at ${REPORT_URL}"
            echo
            echo '> This check reports publication only. Use `CI / E2E` for the functional test result.'
          } >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: Lighthouse
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: dist

      - name: Run Lighthouse CI
        run: bun run test:lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
