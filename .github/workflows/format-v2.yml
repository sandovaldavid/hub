name: Format v2 branch

on:
  push:
    branches: [refactor/v2-release-hardening]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/v2-release-hardening

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatter
        run: bun run format

      - name: Verify formatted diff
        run: git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "[info] Repository already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(v2): apply repository formatting"
          git push origin HEAD:refactor/v2-release-hardening
