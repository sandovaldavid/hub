name: Deploy
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'
      - '.vscode/**'
      - '.vercel/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  deployments: write
  statuses: write

env:
  VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
  VERCEL_PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
  DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
  TRANSIENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'false' || 'true' }}
  PRODUCTION_ENVIRONMENT: ${{ github.ref_name == 'main' && 'true' || 'false' }}

jobs:
  deploy:
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vercel CLI
        run: bun install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "[info] Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Register GitHub Deployment
        id: create_deployment
        run: |
          DEPLOYMENT_ID=$(curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/deployments \
            -d "{\"ref\":\"${{ github.sha }}\",\"environment\":\"${DEPLOYMENT_ENVIRONMENT}\",\"required_contexts\":[],\"transient_environment\":${TRANSIENT_ENVIRONMENT},\"production_environment\":${PRODUCTION_ENVIRONMENT}}" | jq '.id')
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: Set Deployment Status
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment_id }}/statuses \
            -d "{\"state\":\"success\",\"environment_url\":\"${{ steps.deploy.outputs.url }}\",\"log_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"description\":\"Deployment ready\"}"

      - name: Set Preview Commit Status
        if: ${{ github.ref_name == 'develop' }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d '{"state":"success","target_url":"${{ steps.deploy.outputs.url }}","description":"Preview deployment ready","context":"Vercel Preview"}'

  comment-preview:
    if: ${{ github.ref_name == 'develop' }}
    needs: deploy
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL on open PR
        uses: actions/github-script@v9
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:develop`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: `[info] Deploy preview ready: ${{ needs.deploy.outputs.url }}`
              });
            }
