name: Deploy Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  deployments: write
  statuses: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.23.4
  VERCEL_CLI_VERSION: 59.3.0
  VERCEL_ENVIRONMENT: production
  VERCEL_PROD_FLAG: --prod
  DEPLOYMENT_ENVIRONMENT: Production
  TRANSIENT_ENVIRONMENT: 'false'
  PRODUCTION_ENVIRONMENT: 'true'

jobs:
  deploy:
    name: Deploy Production
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Native Vercel deployments handle preview/development on main. Production
      # deployment is driven by published releases and requires the exact-SHA
      # checks and external destinations check before deploying with --prod.
      - name: Require validated checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const required = [
              { name: 'Quality', allowSkipped: false },
              { name: 'Browser', allowSkipped: true },
              { name: 'Dependency audit', allowSkipped: false },
            ];
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 100,
            });

            for (const requirement of required) {
              const runs = data.check_runs.filter(run => run.name === requirement.name);
              const successful = runs.some(run => run.conclusion === 'success');
              const skipped =
                requirement.allowSkipped &&
                runs.length > 0 &&
                runs.every(run => run.conclusion === 'skipped');

              if (!successful && !skipped) {
                core.setFailed(
                  `Required check ${requirement.name} is not successful for ${context.sha}`
                );
                return;
              }
            }

      - name: Check external destinations
        run: bun run check:links:external

      - name: Install Vercel CLI
        run: bun install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "[info] Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Register GitHub Deployment
        id: create_deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ env.DEPLOYMENT_ENVIRONMENT }}
          TRANSIENT_ENVIRONMENT: ${{ env.TRANSIENT_ENVIRONMENT }}
          PRODUCTION_ENVIRONMENT: ${{ env.PRODUCTION_ENVIRONMENT }}
        with:
          result-encoding: string
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              required_contexts: [],
              auto_merge: false,
              transient_environment: process.env.TRANSIENT_ENVIRONMENT === 'true',
              production_environment: process.env.PRODUCTION_ENVIRONMENT === 'true'
            });

            if (!deployment || typeof deployment === 'string' || !Number.isInteger(deployment.id)) {
              throw new Error('GitHub did not return a valid deployment id');
            }

            return String(deployment.id);

      - name: Set Deployment Status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.result }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          LOG_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            if (!Number.isInteger(deploymentId)) {
              throw new Error(`Invalid GitHub deployment id: ${process.env.DEPLOYMENT_ID}`);
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: process.env.DEPLOYED_URL,
              log_url: process.env.LOG_URL,
              description: 'Production deployment ready'
            });
