name: Deploy

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '.agents/**'
      - '.vscode/**'
      - '.vercel/**'
      - 'docs/**'
      - '**.md'
      - '.gitignore'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read
  deployments: write
  statuses: write

env:
  BUN_VERSION: 1.3.14
  NODE_VERSION: 22.19.0
  VERCEL_CLI_VERSION: 59.3.0
  VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
  VERCEL_PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
  DEPLOYMENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }}
  TRANSIENT_ENVIRONMENT: ${{ github.ref_name == 'main' && 'false' || 'true' }}
  PRODUCTION_ENVIRONMENT: ${{ github.ref_name == 'main' && 'true' || 'false' }}

jobs:
  deploy:
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate deploy source
        run: bun run validate:quality

      - name: Install Vercel CLI
        run: bun install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt $VERCEL_PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "[info] Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Register GitHub Deployment
        id: create_deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ env.DEPLOYMENT_ENVIRONMENT }}
          TRANSIENT_ENVIRONMENT: ${{ env.TRANSIENT_ENVIRONMENT }}
          PRODUCTION_ENVIRONMENT: ${{ env.PRODUCTION_ENVIRONMENT }}
        with:
          result-encoding: string
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: process.env.DEPLOYMENT_ENVIRONMENT,
              required_contexts: [],
              auto_merge: false,
              transient_environment: process.env.TRANSIENT_ENVIRONMENT === 'true',
              production_environment: process.env.PRODUCTION_ENVIRONMENT === 'true'
            });

            if (!deployment || typeof deployment === 'string' || !Number.isInteger(deployment.id)) {
              throw new Error('GitHub did not return a valid deployment id');
            }

            return String(deployment.id);

      - name: Set Deployment Status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYMENT_ID: ${{ steps.create_deployment.outputs.result }}
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          LOG_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            if (!Number.isInteger(deploymentId)) {
              throw new Error(`Invalid GitHub deployment id: ${process.env.DEPLOYMENT_ID}`);
            }

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: 'success',
              environment_url: process.env.DEPLOYED_URL,
              log_url: process.env.LOG_URL,
              description: 'Deployment ready'
            });

      - name: Set Preview Commit Status
        if: ${{ github.ref_name == 'develop' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              target_url: process.env.DEPLOYED_URL,
              description: 'Preview deployment ready',
              context: 'Vercel Preview'
            });

  comment-preview:
    if: ${{ github.ref_name == 'develop' }}
    needs: deploy
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview URL on open PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:develop`
            });
            if (prs.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body: `[info] Deploy preview ready: ${{ needs.deploy.outputs.url }}`
              });
            }
