name: Temporary dependency security refresh

on:
  push:
    branches:
      - dependabot/bun/develop/routine-dependencies-428c77761b

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/bun/develop/routine-dependencies-428c77761b

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Update patched security overrides
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.overrides = {
            ...pkg.overrides,
            'js-yaml': '4.3.2',
            'smol-toml': '1.7.1',
            svgo: '4.1.0'
          };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, '\t')}\n`);
          NODE

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Verify security advisories
        run: bun run audit:deps

      - name: Verify repository quality gate
        run: bun run validate:quality

      - name: Remove temporary workflow and commit generated dependency state
        run: |
          git rm .github/workflows/temporary-dependency-security-refresh.yml
          git add package.json bun.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh vulnerable transitive overrides'
          git push origin HEAD:dependabot/bun/develop/routine-dependencies-428c77761b
