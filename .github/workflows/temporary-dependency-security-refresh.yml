name: Temporary dependency security refresh

on:
  push:
    branches:
      - dependabot/bun/develop/routine-dependencies-428c77761b

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/bun/develop/routine-dependencies-428c77761b

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Update patched security overrides and hardening contract
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.overrides = {
            ...pkg.overrides,
            'js-yaml': '4.3.2',
            'smol-toml': '1.7.1',
            svgo: '4.1.0'
          };
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, '\t')}\n`);

          const testPath = 'tests/unit/release-hardening.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('"js-yaml": "4.3.1",', '"js-yaml": "4.3.2",');
          test = test.replace(
            '"svgo": "4.0.2",',
            '"smol-toml": "1.7.1",\n\t\t\t"svgo": "4.1.0",'
          );
          fs.writeFileSync(testPath, test);
          NODE

      - name: Regenerate Bun lockfile
        run: bun install

      - name: Verify security advisories
        run: bun run audit:deps

      - name: Verify repository quality gate
        run: bun run validate:quality

      - name: Remove temporary workflow and commit generated dependency state
        run: |
          git rm .github/workflows/temporary-dependency-security-refresh.yml
          git add package.json bun.lock tests/unit/release-hardening.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh vulnerable transitive overrides'
          git push origin HEAD:dependabot/bun/develop/routine-dependencies-428c77761b
