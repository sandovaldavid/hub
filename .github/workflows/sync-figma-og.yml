name: Sync published Figma OG asset

on:
  push:
    branches:
      - chore/sync-published-preview-libraries
    paths:
      - .github/workflows/sync-figma-og.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-published-preview-libraries

      - name: Download canonical Hub preview
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/29e443c0-5c96-4984-b1a6-7a4a11174383' \
            --output public/og/og-image.png

      - name: Verify PNG contract
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const image = readFileSync('public/og/og-image.png');
          const signature = image.subarray(0, 8).toString('hex');
          const width = image.readUInt32BE(16);
          const height = image.readUInt32BE(20);
          if (signature !== '89504e470d0a1a0a') throw new Error(`Unexpected PNG signature: ${signature}`);
          if (width !== 1200 || height !== 630) throw new Error(`Unexpected dimensions: ${width}x${height}`);
          if (image.byteLength === 0) throw new Error('Downloaded image is empty');
          console.log(`Verified ${width}x${height} PNG (${image.byteLength} bytes)`);
          NODE

      - name: Commit synchronized asset
        run: |
          if git diff --quiet -- public/og/og-image.png; then
            echo 'The repository already contains the published asset.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/og/og-image.png
          git commit -m 'feat(seo): sync published Hub preview asset'
          git push origin HEAD:chore/sync-published-preview-libraries
