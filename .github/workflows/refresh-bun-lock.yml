name: Refresh Bun Lock

on:
  push:
    branches:
      - dependabot/bun/develop/routine-dependencies-ba47a92655

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/bun/develop/routine-dependencies-ba47a92655

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already current"
            exit 0
          fi
          git commit -m "chore(deps): regenerate Bun lock"
          git push origin HEAD:dependabot/bun/develop/routine-dependencies-ba47a92655
